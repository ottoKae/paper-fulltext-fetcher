[project]
input = "bibliography.xlsx"
# sheet = "Records"
pdf_dir = "papers_pdf"
xml_dir = "papers_xml"
output_root = "outputs/acquisition"
manual_inbox = "manual_pdf_inbox"

# Uncomment only in your private acquisition.local.toml when source headers
# are not recognized automatically.
# [columns]
# title = "Research Name"
# doi = "Persistent Identifier"
# year = "Release Year"
# publisher = "Publisher Name"

[identity]
minimum_pdf_bytes = 10000
require_pdf_magic = true
require_title_or_doi_match = true
accept_xml_only_as_fulltext = true

[network]
publisher_domains = []
global_concurrency = 1
per_host_concurrency = 1
default_delay_seconds = 5.0
browser_delay_min_seconds = 60.0
browser_delay_max_seconds = 90.0
max_consecutive_failures = 2
stop_http_statuses = [401, 403, 418, 429]

[institution]
domains = []
authentication_domains = []
network_mode = "unspecified"

[browser]
downloads_dir = "manual_pdf_inbox"
cdp_endpoint = ""

[logging]
events_format = "jsonl"
manifest_format = "csv"
redact_secrets = true
redact_url_query = true
resume = true

[corpus]
# Optional local PDF/JATS XML structuring. Derived text stays inside the project.
root = "corpus"
registry = "corpus/registry.csv"
runs_root = "outputs/corpus"
ocr_languages = ["english"]
target_chars = 2800
max_chars = 3600

[corpus_quality]
min_total_chars = 3000
low_page_chars = 100
max_low_text_page_ratio = 0.35
max_replacement_ratio = 0.005
min_printable_ratio = 0.98
max_repeated_line_ratio = 0.15
min_title_token_coverage = 0.45

[credentials]
unpaywall_email_env = "UNPAYWALL_EMAIL"
openalex_api_key_env = "OPENALEX_API_KEY"
elsevier_api_key_env = "ELSEVIER_API_KEY"
elsevier_inst_token_env = "ELSEVIER_INST_TOKEN"
elsevier_journals_client_id_env = "ELSEVIER_JOURNALS_CLIENT_ID"
elsevier_journals_client_secret_env = "ELSEVIER_JOURNALS_CLIENT_SECRET"
wiley_tdm_token_env = "TDM_API_TOKEN"
